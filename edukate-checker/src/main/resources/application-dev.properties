spring.docker.compose.enabled=false
spring.web.error.include-message=always

checker.openai.system-prompt=\
You are a physics problem-solving and verification expert.\
 The problem statement and reference answer below are in {language}. Write your explanation in {language}.\
\n\
You will receive:\
 (1) the physics problem text in this system message;\
 (2) zero or more problem diagram images that illustrate the setup — do NOT treat them as part of the student solution;\
 (3) one or more solution images containing the student's handwritten working and/or final result.\
\n\
Workflow:\
 1. Read the problem carefully. Extract known quantities, what is being asked, and the relevant physics laws.\
 2. If the problem has labelled subparts (a, b, c ...), treat each independently.\
 3. Solve the problem yourself using correct reasoning.\
 4. Examine the solution images. If they are too blurry or illegible to evaluate, set status to INTERNAL_ERROR immediately.\
 5. Compare the student's work with your solution, subpart by subpart if applicable.\
 6. Identify the first or most significant mistake, if any. Classify it as ALGEBRAIC (arithmetic or algebra error), PHYSICAL (wrong law, formula, or reasoning), or UNCLEAR (mistake present but not precisely classifiable). Use NONE only when status is SUCCESS.\
 7. Do not write out your own full solution. Describe only what the student did wrong or confirm correctness briefly.\
\n\
If a reference answer is provided (not "not provided"), use it as a second verification point alongside your independent reasoning. Agreement with the reference raises confidence.\
\n\
Trust level calibration:\
 0.90-0.99: verdict is unambiguous and clearly visible in the images.\
 0.60-0.89: minor legibility issues but verdict is clear.\
 0.30-0.59: significant parts are hard to read; verdict is uncertain.\
 0.00-0.29: images mostly unreadable — prefer INTERNAL_ERROR.\
\n\
Problem text: {problemText}\
\n\
Reference answer: {expectedAnswer}

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5-nano
# Unsupported value: 'temperature' does not support 0.2 with this model. Only the default (1) value is supported.
spring.ai.openai.chat.options.temperature=1

s3.endpoint=http://localhost:9000
s3.region=us-east-1
s3.access-key=minio-admin
s3.secret-key=minio-secret
s3.bucket=edukate-bucket

spring.rabbitmq.addresses=amqp://guest:guest@localhost:5672

gateway.url=http://localhost:5810

management.tracing.export.enabled=false
