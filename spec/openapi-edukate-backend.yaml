openapi: 3.1.0
info:
  title: Edukate API
  license:
    name: GNU Affero General Public License v3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
  version: 1.0.0
servers:
- url: https://edukatemeplease.online
security:
- cookieAuth: []
tags:
- name: Checker
  description: API for scheduling checks and retrieving check results
- name: Users
  description: API for managing user information
- name: Problems
  description: API for managing and retrieving problems
- name: Submissions
  description: API for managing problem submissions
- name: Temporary Files
  description: API for managing temporary files
- name: Books
  description: API for retrieving problem books
- name: Problem Sets
  description: API for managing problem sets and user collaborations
- name: Answers
  description: API for retrieving problem answers
- name: User Settings
  description: API for managing the current user's profile and credentials
paths:
  /api/v1/users/me/avatar:
    put:
      tags:
      - User Settings
      summary: Upload or replace the current user's avatar
      operationId: uploadAvatar
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Avatar uploaded; body is the new public URL
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Unauthorized
      security:
      - cookieAuth: []
    delete:
      tags:
      - User Settings
      summary: Remove the current user's avatar
      operationId: deleteAvatar
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "204":
          description: Avatar removed
        "401":
          description: Unauthorized
      security:
      - cookieAuth: []
  /api/v1/problem-sets/{shareCode}/members/{username}:
    put:
      tags:
      - Problem Sets
      summary: Set member role
      description: Assigns a role to an existing member. Requires moderator access
        and a higher role than the target.
      operationId: setMemberRole
      parameters:
      - name: shareCode
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: username
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMemberRoleRequest"
        required: true
      responses:
        "400":
          description: Validation failed or would leave no admin
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
        "403":
          description: Caller does not have sufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
        "404":
          description: Problem set or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
      security:
      - cookieAuth: []
    delete:
      tags:
      - Problem Sets
      summary: Remove member
      description: Removes a user from the problem set. Requires moderator access
        and a higher role than the target.
      operationId: removeMember
      parameters:
      - name: shareCode
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: username
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        "400":
          description: Would leave no admin
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
        "403":
          description: Caller does not have sufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
        "404":
          description: Problem set or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
      security:
      - cookieAuth: []
  /api/v1/users/me/email-change:
    post:
      tags:
      - User Settings
      summary: Request an email change — sends a verification link to the new address
      operationId: requestEmailChange
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeRequest"
        required: true
      responses:
        "400":
          description: Invalid email
          content: {}
        "202":
          description: Verification email dispatched
        "401":
          description: Unauthorized
        "409":
          description: Email already in use
      security:
      - cookieAuth: []
  /api/v1/submissions:
    post:
      tags:
      - Submissions
      summary: Upload a submission
      description: Creates a new submission for a problem with the provided files
      operationId: uploadSubmission
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubmissionRequest"
        required: true
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Successfully created submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDto"
        "403":
          description: Access denied - No submit permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDto"
        "404":
          description: "User, problem, or files not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDto"
      security:
      - cookieAuth: []
  /api/v1/problem-sets:
    post:
      tags:
      - Problem Sets
      summary: Create problem set
      description: Creates a new problem set for the authenticated user
      operationId: createProblemSet
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProblemSetRequest"
        required: true
      responses:
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Problem set created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
      security:
      - cookieAuth: []
  /api/v1/problem-sets/{shareCode}/invitations:
    get:
      tags:
      - Problem Sets
      summary: List pending invitations
      description: Lists pending invitees. Requires moderator access.
      operationId: getInvitations
      parameters:
      - name: shareCode
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Successfully retrieved invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "403":
          description: Caller does not have moderator access
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "404":
          description: Problem set not found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      security:
      - cookieAuth: []
    post:
      tags:
      - Problem Sets
      summary: Invite user
      description: Creates a pending invitation and notifies the invitee. Requires
        moderator access.
      operationId: createInvitation
      parameters:
      - name: shareCode
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
        required: true
      responses:
        "400":
          description: Validation failed or user is already a member/invitee
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
        "403":
          description: Caller does not have moderator access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
        "404":
          description: Problem set or invitee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
      security:
      - cookieAuth: []
  /api/v1/problem-sets/{shareCode}/invitations/me/decline:
    post:
      tags:
      - Problem Sets
      summary: Decline invitation
      description: Declines a pending invitation addressed to the caller
      operationId: declineInvitation
      parameters:
      - name: shareCode
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "204":
          description: Invitation declined
        "401":
          description: Unauthorized
        "403":
          description: No pending invitation for the caller
        "404":
          description: Problem set not found
      security:
      - cookieAuth: []
  /api/v1/problem-sets/{shareCode}/invitations/me/accept:
    post:
      tags:
      - Problem Sets
      summary: Accept invitation
      description: Accepts a pending invitation addressed to the caller
      operationId: acceptInvitation
      parameters:
      - name: shareCode
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
        "403":
          description: No pending invitation for the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
        "404":
          description: Problem set not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
      security:
      - cookieAuth: []
  /api/v1/files/temp:
    get:
      tags:
      - Temporary Files
      summary: Get temporary files
      description: Retrieves a list of temporary files for the authenticated user
      operationId: getTempFiles
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Successfully retrieved temporary files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileMetadata"
        "401":
          description: Unauthorized
      security:
      - cookieAuth: []
    post:
      tags:
      - Temporary Files
      summary: Upload temporary file
      description: Uploads a temporary file for the authenticated user
      operationId: uploadTempFile
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Successfully uploaded temporary file
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Unauthorized
        "500":
          description: Failed to uploadDeprecated file
      security:
      - cookieAuth: []
    delete:
      tags:
      - Temporary Files
      summary: Delete temporary file
      description: Deletes a temporary file for the authenticated user
      operationId: deleteTempFile
      parameters:
      - name: fileName
        in: query
        description: Name of a file to delete
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Successfully deleted temporary file
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Unauthorized
        "404":
          description: File not found
        "500":
          description: Failed to delete file
      security:
      - cookieAuth: []
  /api/v1/checker/supervisor:
    post:
      tags:
      - Checker
      summary: Request supervisor check
      description: "\n            Creates a supervisor review ticket for the given\
        \ submission and notifies the assigned supervisor.\n            The caller\
        \ must be the owner of the submission.\n            The specified supervisor\
        \ must have at least the MODERATOR role in the given problem set.\n      \
        \      A PENDING check result stub is created and linked to the ticket; it\
        \ will be resolved when\n            the supervisor submits a verdict via\
        \ POST /supervisor/{ticketId}/verdict.\n        "
      operationId: supervisorCheck
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupervisorTicketRequest"
        required: true
      responses:
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "202":
          description: Supervisor ticket created and supervisor notified
        "401":
          description: Unauthorized
        "403":
          description: Not submission owner or supervisor lacks moderator role
        "404":
          description: "Submission, problem set, or supervisor not found"
      security:
      - cookieAuth: []
  /api/v1/checker/supervisor/{ticketId}/verdict:
    post:
      tags:
      - Checker
      summary: Submit supervisor verdict
      description: "\n            Submits a verdict for a supervisor review ticket.\n\
        \            The caller must be the supervisor assigned to the ticket (supervisorId\
        \ matches authenticated user).\n            Allowed statuses in the verdict\
        \ are SUCCESS and MISTAKE only.\n            On success the linked check result\
        \ is promoted from PENDING to the verdict status (trustLevel = 1.0),\n   \
        \         the ticket is marked RESOLVED, and the submission owner receives\
        \ a notification.\n        "
      operationId: supervisorVerdict
      parameters:
      - name: ticketId
        in: path
        description: Supervisor ticket identifier (from GET /supervisor/my-tickets)
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupervisorVerdict"
        required: true
      responses:
        "400":
          description: "Bad request: SUCCESS/MISTAKE only, explanation non-blank"
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "202":
          description: "Verdict accepted; check result promoted, owner notified"
        "401":
          description: Unauthorized
        "403":
          description: Caller is not the assigned supervisor for this ticket
        "404":
          description: Ticket or associated submission not found
      security:
      - cookieAuth: []
  /api/v1/checker/self:
    post:
      tags:
      - Checker
      summary: Mark submission as self-checked
      description: Creates a self-check result for the provided submission
      operationId: selfCheck
      parameters:
      - name: id
        in: query
        description: Submission identifier
        required: true
        schema:
          type: string
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "202":
          description: Self-check accepted
        "401":
          description: Unauthorized
        "403":
          description: Access denied
        "404":
          description: Submission not found
      security:
      - cookieAuth: []
  /api/v1/checker/ai:
    post:
      tags:
      - Checker
      summary: Schedule AI check
      description: Schedules an asynchronous AI check for the provided submission
      operationId: aiCheck
      parameters:
      - name: id
        in: query
        description: Submission identifier
        required: true
        schema:
          type: string
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "202":
          description: Check scheduled
        "401":
          description: Unauthorized
        "403":
          description: Access denied
        "404":
          description: Submission not found
      security:
      - cookieAuth: []
  /api/v1/problem-sets/{shareCode}:
    get:
      tags:
      - Problem Sets
      summary: Get problem set by share code
      description: Retrieves a problem set by its share code. Returns 404 when the
        set does not exist or is private and the caller is not a member (to avoid
        leaking existence of private sets).
      operationId: getProblemSetByShareCode
      parameters:
      - name: shareCode
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Successfully retrieved problem set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
        "404":
          description: Problem set not found or not visible to caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
      security: []
    patch:
      tags:
      - Problem Sets
      summary: Update problem set settings
      description: "Partially updates one or more configuration fields (name, description,\
        \ isPublic, problemKeys). Null fields are left unchanged. Requires moderator\
        \ access."
      operationId: updateSettings
      parameters:
      - name: shareCode
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProblemSetSettingsRequest"
        required: true
      responses:
        "400":
          description: Validation failed (e.g. empty body)
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
        "403":
          description: Caller does not have moderator access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
        "404":
          description: Problem set not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSetDto"
      security:
      - cookieAuth: []
  /api/v1/users/whoami:
    get:
      tags:
      - Users
      summary: Get current user information
      description: Retrieves information about the currently authenticated user
      operationId: whoami
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Successfully retrieved user information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "404":
          description: User not found by name from token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
      security:
      - cookieAuth: []
  /api/v1/users/info:
    get:
      tags:
      - Users
      summary: Batch lookup of user info (name + avatar URL)
      description: Returns a map of name → UserInfoDto for each name that resolves
        to an existing user. Skips unknown names silently. Use for rendering lists
        of users with avatars.
      operationId: getUserInfo
      parameters:
      - name: names
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
          maxItems: 50
          minItems: 0
      responses:
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Successfully resolved user info
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/UserInfoDto"
      security:
      - cookieAuth: []
  /api/v1/users/by-prefix:
    get:
      tags:
      - Users
      summary: Get usernames by prefix
      description: "Retrieves a list of usernames matching the given prefix, ordered\
        \ alphabetically. When problemSetShareCode is provided, excludes users who\
        \ are already members or invited."
      operationId: getUserNamesByPrefix
      parameters:
      - name: prefix
        in: query
        description: The prefix to match usernames against
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return
        required: false
        schema:
          type: integer
          format: int32
          default: 5
          exclusiveMinimum: 0
      - name: problemSetShareCode
        in: query
        description: "If provided, excludes members and invited users of this problem\
          \ set"
        required: false
        schema:
          type: string
      responses:
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Successfully retrieved usernames
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      security:
      - cookieAuth: []
  /api/v1/submissions/{bookSlug}/{code}/{username}:
    get:
      tags:
      - Submissions
      summary: Get submissions by username and problem key
      description: Retrieves paginated submissions for a specific user and problem
      operationId: getSubmissionsByUsernameAndProblemKey
      parameters:
      - name: bookSlug
        in: path
        description: Book slug
        required: true
        schema:
          type: string
      - name: code
        in: path
        description: Problem code
        required: true
        schema:
          type: string
      - name: username
        in: path
        description: Username
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number (zero-based)
        required: false
        schema:
          type: integer
          minimum: 0
      - name: size
        in: query
        description: Number of submissions per page
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Successfully retrieved submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubmissionDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubmissionDto"
        "403":
          description: Access denied - Requires MODERATOR role
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubmissionDto"
  /api/v1/submissions/search:
    get:
      tags:
      - Submissions
      summary: Search submissions
      description: Search and filter submissions with pagination. File URLs are only
        included for submissions owned by the authenticated user.
      operationId: searchSubmissions
      parameters:
      - name: userPrefix
        in: query
        description: Filter by username prefix
        required: false
        schema:
          type: string
      - name: bookSlugPrefix
        in: query
        description: Filter by book slug prefix
        required: false
        schema:
          type: string
      - name: problemCodePrefix
        in: query
        description: Filter by problem code prefix (e.g. '1.1')
        required: false
        schema:
          type: string
