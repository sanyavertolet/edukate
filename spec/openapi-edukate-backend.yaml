components:
  schemas:
    SetMemberRoleRequest:
      type: object
      properties:
        role:
          type: string
          enum:
          - USER
          - MODERATOR
          - ADMIN
      required:
      - role
    ProblemMetadata:
      type: object
      properties:
        key:
          type: string
        code:
          type: string
        bookSlug:
          type: string
        isHard:
          type: boolean
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - SOLVED
          - SOLVING
          - FAILED
          - NOT_SOLVED
        createdAt:
          type: string
          format: date-time
        language:
          type: string
          enum:
          - RU
          - EN
      required:
      - bookSlug
      - code
      - createdAt
      - isHard
      - key
      - language
      - status
      - tags
    ProblemSetDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        admins:
          type: array
          items:
            type: string
        moderators:
          type: array
          items:
            type: string
        isPublic:
          type: boolean
        problems:
          type: array
          items:
            $ref: "#/components/schemas/ProblemMetadata"
        shareCode:
          type: string
      required:
      - admins
